<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Tab 1 </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

   <ion-list>
    @for (gasto of gastos; track gasto.descricao) {
      <ion-item>
        {{ gasto.descricao }} - R$ {{ gasto.valor }}
      </ion-item>
    }
  </ion-list>

  <ion-button (click)="adicionarGasto()">Adicionar</ion-button>

  <ion-input label="Descrição: " [(ngModel)]="descricao"></ion-input>
  <p>{{ descricao }}</p>
  <ion-input label="Valor: R$ " [(ngModel)]="valor"></ion-input>
  <p>{{ valor }}</p>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container name="Tab 1 page"></app-explore-container>
</ion-content>
