<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gastos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gastos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Diretiva estrutural @for utilizada para iterar sobre a lista de gastos -->
  <ion-list>
    @for (gasto of gastos; track gasto.descricao) {
    <ion-item>
      <ion-label>{{ gasto.descricao }}</ion-label>
      <ion-note slot="end">R$ {{ gasto.valor }}</ion-note>
    </ion-item>
    }
  </ion-list>

  <!-- Diretiva personalizada [(ngModel)] utilizada para vincular os valores dos inputs ao componente -->
  <ion-input label="Descrição" labelPlacement="floating" fill="outline" [(ngModel)]="descricao"></ion-input>
  <ion-input
    class="value-input"
    label="Valor (R$)"
    labelPlacement="floating"
    fill="outline"
    type="number"
    [(ngModel)]="valor"
  ></ion-input>

  <ion-button expand="block" (click)="adicionarGasto()">Adicionar</ion-button>
</ion-content>
